<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated 5-Year Fundamental Analyzer (FMP)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .control-panel { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group > div { flex: 1; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        #ticker { text-transform: uppercase; }
        button { width: 100%; padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .loader { display: none; text-align: center; font-style: italic; color: #666; margin: 20px 0; font-weight: bold; }
        .dashboard { display: none; margin-top: 30px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .metric { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e1e4e8; border-left: 5px solid #007bff; }
        .alert-red { border-left-color: #dc3545; background-color: #fff5f5; }
        .alert-yellow { border-left-color: #ffc107; background-color: #fffdf5; }
        .alert-green { border-left-color: #28a745; background-color: #f4fff5; }
        .verdict-box { padding: 20px; border-radius: 8px; text-align: center; font-size: 22px; font-weight: bold; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .verdict-good { background-color: #28a745; }
        .verdict-high { background-color: #fd7e14; }
        .verdict-bad { background-color: #dc3545; }
        .small-text { font-size: 12px; color: #666; margin-top: 5px; display: block; }
        .error { color: #dc3545; font-weight: bold; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Automated Fundamental Analyzer</h1>
    
    <div class="control-panel">
        <div class="input-group">
            <div>
                <label for="apiKey">FMP API Key (Stored locally):</label>
                <input type="password" id="apiKey" placeholder="Paste your free API key here">
            </div>
            <div>
                <label for="ticker">Stock Ticker:</label>
                <input type="text" id="ticker" placeholder="e.g. AAPL, MSFT, SAP">
            </div>
        </div>
        <button onclick="fetchData()">Run Full Analysis</button>
        <div id="errorMessage" class="error"></div>
    </div>
    
    <div id="loader" class="loader">Downloading 5-year financials and calculating metrics...</div>
    
    <div id="dashboard" class="dashboard">
        <h2 id="companyTitle" style="text-align: center; color: #2c3e50;"></h2>
        <div class="metrics-grid" id="metricsGrid"></div>
        <div id="verdictContainer"></div>
    </div>
</div>

<script>
    async function fetchData() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const ticker = document.getElementById('ticker').value.trim().toUpperCase();
        const errBox = document.getElementById('errorMessage');

        errBox.style.display = 'none';
        document.getElementById('dashboard').style.display = 'none';

        if (!apiKey) return showError("Please enter your FMP API Key.");
        if (!ticker) return showError("Please enter a stock ticker.");

        document.getElementById('loader').style.display = 'block';

        try {
            // Fetch 3 endpoints simultaneously for speed: Price, Income Statement (5 yrs), Balance Sheet (1 yr)
            const [quoteRes, incomeRes, balanceRes] = await Promise.all([
                fetch(`https://financialmodelingprep.com/api/v3/quote/${ticker}?apikey=${apiKey}`),
                fetch(`https://financialmodelingprep.com/api/v3/income-statement/${ticker}?limit=5&apikey=${apiKey}`),
                fetch(`https://financialmodelingprep.com/api/v3/balance-sheet-statement/${ticker}?limit=1&apikey=${apiKey}`)
            ]);

            const quoteData = await quoteRes.json();
            const incomeData = await incomeRes.json();
            const balanceData = await balanceRes.json();

            // Error handling for bad API keys or invalid tickers
            if (incomeData['Error Message']) throw new Error("Invalid API Key or API limit reached.");
            if (quoteData.length === 0 || incomeData.length === 0) throw new Error("Ticker not found or no financial data available.");

            processMetrics(ticker, quoteData[0], incomeData, balanceData[0]);

        } catch (error) {
            showError(error.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function showError(msg) {
        const errBox = document.getElementById('errorMessage');
        errBox.innerText = `Error: ${msg}`;
        errBox.style.display = 'block';
    }

    function processMetrics(ticker, quote, incomeHistory, currentBalance) {
        const companyName = quote.name;
        const currentPrice = quote.price;
        
        // FMP returns data from newest (index 0) to oldest
        const currentIncome = incomeHistory[0];
        const oldestIncome = incomeHistory[incomeHistory.length - 1]; // Up to 5 years ago
        const yearsOfData = incomeHistory.length;

        document.getElementById('companyTitle').innerText = `${companyName} (${ticker}) Analysis`;

        let html = '';
        let isSustainable = true;

        // 1. Current P/E Ratio
        let peRatio = 0;
        if (currentIncome.epsdiluted > 0) {
            peRatio = currentPrice / currentIncome.epsdiluted;
            const peClass = peRatio > 25 ? 'alert-yellow' : 'alert-green';
            html += createCard('Current P/E Ratio', `${peRatio.toFixed(2)}x`, peClass, `Price: $${currentPrice.toFixed(2)} / EPS: $${currentIncome.epsdiluted.toFixed(2)}`);
        } else {
            html += createCard('Current P/E Ratio', 'Negative', 'alert-red', 'Company is currently losing money.');
            isSustainable = false;
        }

        // 2. Revenue CAGR (Compound Annual Growth Rate)
        if (yearsOfData > 1 && oldestIncome.revenue > 0) {
            const timePeriods = yearsOfData - 1; 
            const revCagr = (Math.pow((currentIncome.revenue / oldestIncome.revenue), (1 / timePeriods)) - 1) * 100;
            const revClass = revCagr <= 0 ? 'alert-red' : (revCagr < 5 ? 'alert-yellow' : 'alert-green');
            if (revCagr <= 0) isSustainable = false;
            html += createCard(`${yearsOfData}-Year Revenue CAGR`, `${revCagr.toFixed(2)}%`, revClass, `From $${(oldestIncome.revenue/1e9).toFixed(2)}B to $${(currentIncome.revenue/1e9).toFixed(2)}B`);
        } else {
            html += createCard('Revenue Growth', 'N/A', 'alert-yellow', 'Not enough historical data.');
        }

        // 3. EPS CAGR
        if (yearsOfData > 1 && oldestIncome.epsdiluted > 0 && currentIncome.epsdiluted > 0) {
            const timePeriods = yearsOfData - 1;
            const epsCagr = (Math.pow((currentIncome.epsdiluted / oldestIncome.epsdiluted), (1 / timePeriods)) - 1) * 100;
            const epsClass = epsCagr <= 0 ? 'alert-red' : (epsCagr < 5 ? 'alert-yellow' : 'alert-green');
            if (epsCagr <= 0) isSustainable = false;
            html += createCard(`${yearsOfData}-Year EPS CAGR`, `${epsCagr.toFixed(2)}%`, epsClass, `From $${oldestIncome.epsdiluted.toFixed(2)} to $${currentIncome.epsdiluted.toFixed(2)}`);
        } else {
            html += createCard('EPS Growth', 'N/A', 'alert-yellow', 'Negative earnings prevent CAGR calculation.');
            isSustainable = false;
        }

        // 4. Net Income Margin
        if (currentIncome.netIncome && currentIncome.revenue > 0) {
            const margin = (currentIncome.netIncome / currentIncome.revenue) * 100;
            const marginClass = margin < 0 ? 'alert-red' : (margin < 10 ? 'alert-yellow' : 'alert-green');
            if (margin < 0) isSustainable = false;
            html += createCard('Net Income Margin', `${margin.toFixed(2)}%`, marginClass, `Net Income: $${(currentIncome.netIncome/1e9).toFixed(2)}B`);
        }

        // 5. Debt to Revenue Ratio
        if (currentBalance && currentBalance.longTermDebt !== undefined && currentIncome.revenue > 0) {
            const debtRatio = currentBalance.longTermDebt / currentIncome.revenue;
            const debtClass = debtRatio > 1.5 ? 'alert-red' : (debtRatio > 0.8 ? 'alert-yellow' : 'alert-green');
            if (debtRatio > 2.0) isSustainable = false;
            html += createCard('Debt / Revenue', `${debtRatio.toFixed(2)}x`, debtClass, `Long Term Debt: $${(currentBalance.longTermDebt/1e9).toFixed(2)}B`);
        }

        // 6. Share Dilution (Current Year)
        if (currentIncome.eps && currentIncome.epsdiluted && currentIncome.eps > 0) {
            const dilution = ((currentIncome.eps - currentIncome.epsdiluted) / currentIncome.eps) * 100;
            const dilClass = dilution > 5 ? 'alert-yellow' : 'alert-green';
            html += createCard('Current Share Dilution', `${dilution.toFixed(2)}%`, dilClass, `Basic: $${currentIncome.eps.toFixed(2)} | Diluted: $${currentIncome.epsdiluted.toFixed(2)}`);
        }

        document.getElementById('metricsGrid').innerHTML = html;

        // --- FINAL VERDICT ---
        let verdictText = "";
        let verdictClass = "";

        if (!isSustainable) {
            verdictText = "Unsustainable company";
            verdictClass = "verdict-bad";
        } else {
            if (peRatio > 0 && peRatio <= 25) {
                verdictText = "Sustainable company at a good price";
                verdictClass = "verdict-good";
            } else {
                verdictText = "Sustainable company at a high price";
                verdictClass = "verdict-high";
            }
        }

        document.getElementById('verdictContainer').innerHTML = `<div class="verdict-box ${verdictClass}">${verdictText}</div>`;
        document.getElementById('dashboard').style.display = 'block';
    }

    function createCard(title, value, cssClass, subtext) {
        return `<div class="metric ${cssClass}">
                    <strong>${title}</strong><br>
                    <span style="font-size: 26px;">${value}</span><br>
                    <span class="small-text">${subtext}</span>
                </div>`;
    }
</script>

</body>
</html>
